# A long-lived local fediverse for development: Megáfono behind its gateway, the sample app, GoToSocial and (optional)
# Mastodon, all behind one Caddy that serves app.test, gts.test and mastodon.test over HTTPS with its own local CA.
# DEVELOPMENT ONLY: Megáfono runs in Development with private addresses allowed, and its internal API is published on
# 127.0.0.1. The production deployment is deploy/compose.yaml. Start it with ./setup.sh (README.md says what that does).

name: megafono-dev

x-mastodon-env: &mastodon-env
  RAILS_ENV: production
  LOCAL_DOMAIN: mastodon.test
  SECRET_KEY_BASE: ${MASTODON_SECRET_KEY_BASE:?run ./setup.sh}
  # Required since Mastodon 4.3; any random 32-character strings work.
  ACTIVE_RECORD_ENCRYPTION_DETERMINISTIC_KEY: ${MASTODON_AR_DETERMINISTIC_KEY:?run ./setup.sh}
  ACTIVE_RECORD_ENCRYPTION_KEY_DERIVATION_SALT: ${MASTODON_AR_KEY_DERIVATION_SALT:?run ./setup.sh}
  ACTIVE_RECORD_ENCRYPTION_PRIMARY_KEY: ${MASTODON_AR_PRIMARY_KEY:?run ./setup.sh}
  DB_HOST: mastodon-db
  DB_PORT: "5432"
  DB_USER: mastodon
  DB_NAME: mastodon
  DB_PASS: ${MASTODON_DB_PASSWORD:?run ./setup.sh}
  REDIS_HOST: mastodon-redis
  REDIS_PORT: "6379"
  ES_ENABLED: "false"
  SINGLE_USER_MODE: "false"
  # The strictest mode: Mastodon signs its fetches and refuses unsigned fetches, so a Megáfono bug that skips
  # signatures shows up here instead of in production.
  AUTHORIZED_FETCH: "true"
  # Without it Mastodon refuses to dial app.test, which resolves to a private address.
  ALLOWED_PRIVATE_ADDRESSES: 172.29.0.0/24
  # Mastodon checks the MX record of an e-mail domain in production, which a .test domain fails.
  EMAIL_DOMAIN_ALLOWLIST: mastodon.test
  # Only Caddy's local CA: nothing here needs the system roots.
  SSL_CERT_FILE: /ca/root.crt

services:
  caddy:
    image: docker.io/library/caddy:2.11.7-alpine
    restart: unless-stopped
    ports:
      - "443:443" # the only public port; port 80 is not published
    volumes:
      - ./Caddyfile:/etc/caddy/Caddyfile:ro
      - caddy-data:/data # holds the local CA: it must survive restarts, or every trust step is lost
      - caddy-config:/config
    networks:
      default:
        ipv4_address: 172.29.0.10 # fixed, so GoToSocial and Megáfono can trust its X-Forwarded-For
        aliases: [app.test, gts.test, mastodon.test] # every container reaches the three sites through Caddy, as a remote server would

  # Copies Caddy's root certificate where any user can read it. Caddy creates its storage directories 0700, and
  # Megáfono (user app) and GoToSocial (uid 1000) cannot read them.
  ca:
    image: docker.io/library/caddy:2.11.7-alpine
    restart: "no"
    entrypoint: ["sh", "-c"]
    command:
      - |
        src=/data/caddy/pki/authorities/local/root.crt
        for i in $$(seq 1 60); do
          if [ -s "$$src" ]; then
            cp "$$src" /ca/root.crt && chmod 0644 /ca/root.crt && exit 0
          fi
          sleep 1
        done
        echo "Caddy did not create its root certificate within 60 s: docker compose logs caddy" >&2
        exit 1
    volumes:
      - caddy-data:/data:ro
      - ca:/ca
    depends_on: [caddy]

  db:
    image: postgres:17-alpine
    restart: unless-stopped
    environment:
      POSTGRES_DB: megafono
      POSTGRES_USER: megafono
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:?run ./setup.sh}
    volumes:
      - db-data:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U megafono -d megafono"]
      interval: 5s
      timeout: 3s
      retries: 20

  megafono:
    build:
      context: ../..
      dockerfile: deploy/Dockerfile.megafono
    image: megafono-dev/megafono:local
    restart: unless-stopped
    environment:
      # Production refuses AllowPrivateAddresses, and GoToSocial and Mastodon sit on private addresses here.
      ASPNETCORE_ENVIRONMENT: Development
      Megafono__Domain: app.test
      Megafono__MasterKey: ${MEGAFONO_MASTER_KEY:?run ./setup.sh}
      Megafono__App__BaseUrl: ${APP_URL:-http://sample:8080} # see README.md, "Pointing a real app at it"
      Megafono__App__Token: ${MEGAFONO_TOKEN:?run ./setup.sh}
      Megafono__App__WebhookSecret: ${MEGAFONO_WEBHOOK_SECRET:?run ./setup.sh}
      ConnectionStrings__Database: Host=db;Database=megafono;Username=megafono;Password=${POSTGRES_PASSWORD:?run ./setup.sh}
      Megafono__TrustedProxies: 172.29.0.11 # the gateway; without it every request would count as the gateway's address
      Megafono__Federation__AllowPrivateAddresses: "true"
      SSL_CERT_FILE: /ca/root.crt
    ports:
      # Development convenience, never done in deploy/compose.yaml: lets an app on the host (or curl) call /internal/*.
      # Loopback only, and the bearer token still applies.
      - "127.0.0.1:8081:8081"
    extra_hosts:
      - "host.docker.internal:host-gateway" # Docker Desktop has it already; Linux needs this line
    volumes:
      - ca:/ca:ro
    depends_on:
      db:
        condition: service_healthy
      ca:
        condition: service_completed_successfully

  gateway:
    build:
      context: ../..
      dockerfile: deploy/Dockerfile.gateway
    image: megafono-dev/megafono-gateway:local
    restart: unless-stopped
    # No certificate: Caddy terminates TLS, and the gateway listens on plain http, port 8080.
    environment:
      ReverseProxy__Clusters__megafono__Destinations__primary__Address: http://megafono:8080
      ReverseProxy__Clusters__app__Destinations__primary__Address: ${APP_URL:-http://sample:8080}
      Gateway__TrustedProxies: 172.29.0.10 # Caddy: the gateway believes its X-Forwarded-For and X-Forwarded-Proto
    extra_hosts:
      - "host.docker.internal:host-gateway"
    networks:
      default:
        ipv4_address: 172.29.0.11 # fixed, so Megáfono can trust its X-Forwarded-For
    depends_on: [megafono]

  sample:
    build:
      context: ../..
      dockerfile: deploy/Dockerfile.sample
    image: megafono-dev/megafono-sample:local # built from this checkout, never published
    restart: unless-stopped
    environment:
      APP__DOMAIN: app.test
      MEGAFONO__URL: http://megafono:8081
      MEGAFONO__TOKEN: ${MEGAFONO_TOKEN:?run ./setup.sh}
      MEGAFONO__WEBHOOKSECRET: ${MEGAFONO_WEBHOOK_SECRET:?run ./setup.sh}
      SAMPLE__ADMINPASSWORD: ${SAMPLE_ADMIN_PASSWORD:?run ./setup.sh}
    depends_on: [megafono]

  gotosocial:
    image: docker.io/superseriousbusiness/gotosocial:0.22.2
    restart: unless-stopped
    environment:
      GTS_HOST: gts.test
      GTS_ACCOUNT_DOMAIN: gts.test
      GTS_PROTOCOL: https
      GTS_DB_TYPE: sqlite
      GTS_DB_ADDRESS: /gotosocial/storage/sqlite.db
      GTS_LETSENCRYPT_ENABLED: "false"
      GTS_ADVANCED_RATE_LIMIT_REQUESTS: "0" # 0 or less turns rate limiting off
      GTS_TRUSTED_PROXIES: 172.29.0.10 # Caddy
      # Without it GoToSocial refuses to dial the Docker network ("dial within blocked / reserved IP range").
      GTS_HTTP_CLIENT_ALLOW_IPS: 172.29.0.0/24
      SSL_CERT_FILE: /ca/root.crt
    volumes:
      - gts-data:/gotosocial/storage # the image's storage directory belongs to uid 1000, which the volume inherits
      - ca:/ca:ro
    depends_on:
      ca:
        condition: service_completed_successfully

  # ---- Mastodon (docker compose --profile mastodon up -d, or ./setup.sh --mastodon) ----------------------------------

  mastodon-db:
    profiles: [mastodon]
    image: postgres:17-alpine
    restart: unless-stopped
    environment:
      POSTGRES_DB: mastodon
      POSTGRES_USER: mastodon
      POSTGRES_PASSWORD: ${MASTODON_DB_PASSWORD:?run ./setup.sh}
    volumes:
      - mastodon-db-data:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U mastodon -d mastodon"]
      interval: 5s
      timeout: 3s
      retries: 20

  mastodon-redis:
    profiles: [mastodon]
    image: redis:7-alpine
    restart: unless-stopped
    volumes:
      - mastodon-redis-data:/data
    healthcheck:
      test: ["CMD", "redis-cli", "ping"]
      interval: 5s
      timeout: 3s
      retries: 20

  mastodon-web:
    profiles: [mastodon]
    image: ghcr.io/mastodon/mastodon:v4.7.3
    restart: unless-stopped
    # db:prepare, not db:setup: setup reloads the schema and would wipe the data on every restart.
    command: ["sh", "-c", "bundle exec rails db:prepare && exec bundle exec puma -C config/puma.rb"]
    environment: *mastodon-env
    volumes:
      - ca:/ca:ro
    healthcheck:
      test: ["CMD-SHELL", "curl -s --noproxy localhost localhost:3000/health | grep -q OK"]
      interval: 10s
      timeout: 5s
      retries: 30
      start_period: 120s # the first start loads the schema
    depends_on:
      mastodon-db:
        condition: service_healthy
      mastodon-redis:
        condition: service_healthy
      ca:
        condition: service_completed_successfully

  mastodon-sidekiq:
    profiles: [mastodon]
    image: ghcr.io/mastodon/mastodon:v4.7.3
    restart: unless-stopped
    command: ["bundle", "exec", "sidekiq"]
    environment: *mastodon-env
    volumes:
      - ca:/ca:ro
    depends_on:
      mastodon-web:
        condition: service_healthy # the schema exists once the web container is healthy

  mastodon-streaming:
    profiles: [mastodon]
    image: ghcr.io/mastodon/mastodon-streaming:v4.7.3
    restart: unless-stopped
    environment:
      DB_HOST: mastodon-db
      DB_PORT: "5432"
      DB_USER: mastodon
      DB_NAME: mastodon
      DB_PASS: ${MASTODON_DB_PASSWORD:?run ./setup.sh}
      REDIS_HOST: mastodon-redis
      REDIS_PORT: "6379"
    depends_on:
      mastodon-web:
        condition: service_healthy

networks:
  default:
    name: megafono-dev # explicit, so another Compose project or an Aspire AppHost can attach to it
    ipam:
      config:
        - subnet: 172.29.0.0/24 # deploy/compose.yaml uses 172.30 and 172.31

volumes:
  caddy-data: {}
  caddy-config: {}
  ca: {}
  db-data: {}
  gts-data: {}
  mastodon-db-data: {}
  mastodon-redis-data: {}
