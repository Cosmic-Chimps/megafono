# Reference deployment (US5, FR-063): one public service, the gateway, in front of Megáfono and the sample app.
# Run from the repository root or from deploy/ with: docker compose -f deploy/compose.yaml --env-file deploy/.env up -d --build
# Every setting comes from the environment; deploy/.env.example documents each one.

name: megafono

services:
  gateway:
    build:
      context: ..
      dockerfile: deploy/Dockerfile.gateway
    image: megafono/gateway
    restart: unless-stopped
    ports:
      - "443:443" # the only published port
    environment:
      Kestrel__Certificates__Default__Path: /certs/tls.crt
      Kestrel__Certificates__Default__KeyPath: /certs/tls.key
      ReverseProxy__Clusters__megafono__Destinations__primary__Address: http://megafono:8080
      ReverseProxy__Clusters__app__Destinations__primary__Address: http://sample:8080
    volumes:
      - ${TLS_CERT_PATH:?set TLS_CERT_PATH}:/certs/tls.crt:ro
      - ${TLS_KEY_PATH:?set TLS_KEY_PATH}:/certs/tls.key:ro
    networks:
      edge:
        ipv4_address: 172.30.0.10 # fixed, so Megáfono can trust its X-Forwarded-For (per-address rate limits)
    depends_on: [megafono, sample]

  sample:
    build:
      context: ..
      dockerfile: deploy/Dockerfile.sample
    image: megafono/sample
    restart: unless-stopped
    environment:
      APP__DOMAIN: ${DOMAIN:?set DOMAIN}
      MEGAFONO__URL: http://megafono:8081 # the internal API, reachable only on the internal network
      MEGAFONO__TOKEN: ${MEGAFONO_TOKEN:?set MEGAFONO_TOKEN}
      MEGAFONO__WEBHOOKSECRET: ${MEGAFONO_WEBHOOK_SECRET:?set MEGAFONO_WEBHOOK_SECRET}
      SAMPLE__ADMINPASSWORD: ${SAMPLE_ADMIN_PASSWORD:?set SAMPLE_ADMIN_PASSWORD}
    networks: [edge, internal]

  megafono:
    build:
      context: ..
      dockerfile: deploy/Dockerfile.megafono
    image: megafono/megafono
    restart: unless-stopped
    environment:
      Megafono__Domain: ${DOMAIN:?set DOMAIN}
      Megafono__MasterKey: ${MEGAFONO_MASTER_KEY:?set MEGAFONO_MASTER_KEY}
      Megafono__App__BaseUrl: http://sample:8080
      Megafono__App__Token: ${MEGAFONO_TOKEN:?set MEGAFONO_TOKEN}
      Megafono__App__WebhookSecret: ${MEGAFONO_WEBHOOK_SECRET:?set MEGAFONO_WEBHOOK_SECRET}
      ConnectionStrings__Database: Host=db;Database=megafono;Username=megafono;Password=${POSTGRES_PASSWORD:?set POSTGRES_PASSWORD}
      Megafono__TrustedProxies: 172.30.0.10 # the gateway; without it every request would count as the gateway's address
    # 8080 (federation) is routed by the gateway over edge; 8081 (internal API) is only on internal and never published.
    # Both ports are listed here only so the intent is visible: no `ports:` entry exists for either.
    networks: [edge, internal]
    depends_on:
      db:
        condition: service_healthy

  db:
    image: postgres:17-alpine
    restart: unless-stopped
    environment:
      POSTGRES_DB: megafono
      POSTGRES_USER: megafono
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:?set POSTGRES_PASSWORD}
    volumes:
      - db-data:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U megafono -d megafono"]
      interval: 5s
      timeout: 3s
      retries: 20
    networks: [internal]

networks:
  edge: # gateway, megafono (federation port), sample
    ipam:
      config:
        - subnet: 172.30.0.0/24
  internal:
    internal: true # no route to the outside: sample, megafono (internal API), db

volumes:
  db-data: {}
