# Release: start it from the Actions tab (release > Run workflow > branch main > version X.Y.Z), or push
# a tag like v1.2.3. Either way this workflow
#
#   1. runs the same tests as CI, on the commit the run started from, so red tests never leave a tag,
#   2. gets the changelog right, and fails, before anything is built, when there is nothing under
#      "## Unreleased" (no empty releases):
#        - Run workflow: it turns "## Unreleased" into "## X.Y.Z - <today>", commits that to main as
#          github-actions[bot], tags that commit vX.Y.Z and pushes both in one atomic push. The tag
#          therefore always contains its own changelog section. If main moved during the tests, the
#          push is refused and nothing is tagged: run it again.
#        - a pushed tag: the section is prepared in this run's own checkout and recorded on main
#          afterwards, only if main is still the tagged commit (job `release`). The tag never moves.
#      A prerelease such as 1.2.0-rc.1 only gets its tag, on the tested commit, and leaves the
#      changelog alone,
#   3. builds linux/amd64 and linux/arm64 and pushes ghcr.io/<owner>/megafono:1.2.3 and
#      ghcr.io/<owner>/megafono-gateway:1.2.3 (also :1.2 and :latest, unless it is a prerelease),
#   4. publishes the GitHub release with the changelog section as its notes,
#   5. keeps the last 10 versions of each image and deletes older ones.
#
# Nothing is deployed from here: Megáfono runs as services of the app it serves (on Caravana, one app
# with the gateway, the app, Megáfono and Postgres), and that app's deployment pins a Megáfono version.
# The sample image is never published.
#
# Every job after `changelog` takes the version and the tag from that job's outputs, never from
# GITHUB_REF_NAME (which is "main" on a Run workflow), and checks out the tag, so it builds exactly
# the tagged commit. Ported from Umbral's release workflow.
#
# Setup, once: main must accept pushes from github-actions (no branch protection against it), and the
# two GHCR packages are private after their first push until their visibility is changed to public.
name: release

on:
  push:
    tags: ['v*']
  workflow_dispatch:
    inputs:
      version:
        description: 'X.Y.Z, no v'
        required: true
        type: string

permissions:
  contents: read

# Two releases run one after the other, never at once: both would push to main, and the prune of one
# must not race the push of the next.
concurrency:
  group: release
  cancel-in-progress: false

jobs:
  # The same tests as CI, on the commit the run started from: main's tip for a Run workflow, the tagged
  # commit for a tag push. They come first, so a failing test leaves no tag behind.
  test:
    uses: ./.github/workflows/ci.yml

  # The version, the notes and, on a Run workflow, the release itself. A release (1.2.3) gets its
  # section of CHANGELOG.md; when the commit has none, "## Unreleased" is renamed in this checkout, which
  # fails when it is empty. A prerelease (1.2.3-rc.1) is never prepared: its notes say so and list what
  # is under Unreleased. The notes (and, for a pushed tag, the prepared changelog) go to the release
  # job as an artifact.
  changelog:
    needs: test
    runs-on: ubuntu-latest
    permissions:
      contents: write # a Run workflow pushes the changelog commit and the tag
    outputs:
      version: ${{ steps.ver.outputs.version }} # X.Y.Z or X.Y.Z-suffix, no v
      minor: ${{ steps.ver.outputs.minor }} # X.Y, the moving minor tag of a release
      tag: ${{ steps.ver.outputs.tag }} # vX.Y.Z...
      prerelease: ${{ steps.ver.outputs.prerelease }} # 'true' or 'false'
    steps:
      # A Run workflow works on the commit the tests just passed on (full history, to push to main and
      # to see every tag): if main moved meanwhile, the atomic push below is refused and nothing is
      # tagged. A tag push works on its own tag.
      - uses: actions/checkout@v4
        with:
          ref: ${{ github.event_name == 'workflow_dispatch' && github.sha || github.ref }}
          fetch-depth: 0

      - name: Decide the version
        id: ver
        env:
          INPUT_VERSION: ${{ inputs.version }}
        run: |
          if [ "$GITHUB_EVENT_NAME" = "workflow_dispatch" ]; then
            if [ "$GITHUB_REF" != "refs/heads/main" ]; then
              echo "::error::Run this workflow on main (it was run on $GITHUB_REF): the release commit and the tag are made on main."
              exit 1
            fi
            VERSION="${INPUT_VERSION#v}"
          else
            VERSION="${GITHUB_REF_NAME#v}"
          fi
          if ! [[ "$VERSION" =~ ^[0-9]+\.[0-9]+\.[0-9]+(-[0-9A-Za-z.]+)?$ ]]; then
            echo "::error::\"$VERSION\" is not X.Y.Z (a prerelease suffix is allowed, like 1.2.0-rc.1)."
            exit 1
          fi
          PRERELEASE=false
          if [[ "$VERSION" == *-* ]]; then PRERELEASE=true; fi
          MINOR="${VERSION%.*}"
          {
            echo "version=$VERSION"
            echo "minor=$MINOR"
            echo "tag=v$VERSION"
            echo "prerelease=$PRERELEASE"
          } >> "$GITHUB_OUTPUT"

      # Before anything is written: a tag that exists, here or on the remote, is never reused.
      - name: Refuse a tag that already exists
        if: ${{ github.event_name == 'workflow_dispatch' }}
        env:
          TAG: ${{ steps.ver.outputs.tag }}
        run: |
          git fetch --tags --force -q origin
          if git rev-parse -q --verify "refs/tags/$TAG" >/dev/null || [ -n "$(git ls-remote --tags origin "refs/tags/$TAG")" ]; then
            echo "::error::The tag $TAG already exists. Pick another version, or delete the tag first (git push --delete origin $TAG, and gh release delete $TAG --yes if it has a GitHub release) and run this workflow again."
            exit 1
          fi

      - name: Notes
        env:
          VERSION: ${{ steps.ver.outputs.version }}
          PRERELEASE: ${{ steps.ver.outputs.prerelease }}
        run: |
          mkdir out
          if [ "$PRERELEASE" = "true" ]; then
            {
              echo "Prerelease $VERSION: a version to try, not a release. Its images are published by tag only, and \`latest\` and the changelog stay as they were."
              if [ -n "$(.github/scripts/changelog.sh unreleased)" ]; then
                echo
                echo "What is on its way, from the changelog's \"Unreleased\" section:"
                echo
                .github/scripts/changelog.sh unreleased
              fi
            } > out/notes.md
          else
            .github/scripts/changelog.sh notes "$VERSION" >/dev/null 2>&1 ||
              .github/scripts/changelog.sh prepare "$VERSION"
            .github/scripts/changelog.sh notes "$VERSION" > out/notes.md
            cp CHANGELOG.md out/CHANGELOG.md
          fi
          { echo "### Release notes"; echo; cat out/notes.md; } >> "$GITHUB_STEP_SUMMARY"

      # Run workflow only: commit the renamed changelog to main, tag that commit and push both at once
      # (atomic: if main moved meanwhile, nothing is pushed and the run fails, so run it again). A
      # prerelease only gets its tag. A tag pushed with GITHUB_TOKEN does not start another workflow run
      # (GitHub suppresses it), so there is no second release: this run goes on to build and publish the
      # tag it just made.
      - name: Commit the changelog, tag and push
        if: ${{ github.event_name == 'workflow_dispatch' }}
        env:
          VERSION: ${{ steps.ver.outputs.version }}
          TAG: ${{ steps.ver.outputs.tag }}
          PRERELEASE: ${{ steps.ver.outputs.prerelease }}
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          if [ "$PRERELEASE" != "true" ] && ! git diff --quiet -- CHANGELOG.md; then
            git commit -m "chore(release): $VERSION" -- CHANGELOG.md
          fi
          git tag -a "$TAG" -m "$TAG"
          if [ "$PRERELEASE" = "true" ]; then
            git push origin "refs/tags/$TAG"
          else
            git push --atomic origin HEAD:main "refs/tags/$TAG"
          fi
          echo "Tagged $TAG at $(git rev-parse --short HEAD)" >> "$GITHUB_STEP_SUMMARY"

      - uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: release-notes
          path: out
          if-no-files-found: error

  image:
    needs: [test, changelog]
    runs-on: ubuntu-latest
    permissions:
      contents: read
      packages: write
    strategy:
      fail-fast: true
      matrix:
        include:
          - package: megafono
            dockerfile: deploy/Dockerfile.megafono
          - package: megafono-gateway
            dockerfile: deploy/Dockerfile.gateway
    steps:
      # The tag, not the ref the run started from: the tagged commit is what gets built (on a Run
      # workflow it includes the changelog commit).
      - uses: actions/checkout@v4
        with:
          ref: ${{ needs.changelog.outputs.tag }}

      # GHCR names are lowercase, and a GitHub owner can have capitals (Cosmic-Chimps)
      - name: Image name
        id: name
        run: echo "image=ghcr.io/${GITHUB_REPOSITORY_OWNER,,}/${{ matrix.package }}" >> "$GITHUB_OUTPUT"

      # The build stage runs on the runner's own platform and publishes portable IL, and the runtime
      # stage has no RUN, so no QEMU is needed for the arm64 image.
      - uses: docker/setup-buildx-action@f87e5991a6d7451dcb8d9637bfbc97413f497069 # v4.4.1

      - uses: docker/login-action@dbcb813823bdd20940b903addbd779551569679f # v4.6.0
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      # org.opencontainers.image.source (the repository) is among the labels this sets: it links the
      # package to the repository on GHCR. `X.Y` and `latest` only move for a release. The version comes
      # from the changelog job's outputs: github.ref_name is "main" on a Run workflow.
      - name: Tags and labels
        id: meta
        uses: docker/metadata-action@dc802804100637a589fabce1cb79ff13a1411302 # v6.2.0
        with:
          images: ${{ steps.name.outputs.image }}
          flavor: latest=false
          tags: |
            type=raw,value=${{ needs.changelog.outputs.version }}
            type=raw,value=${{ needs.changelog.outputs.minor }},enable=${{ needs.changelog.outputs.prerelease != 'true' }}
            type=raw,value=latest,enable=${{ needs.changelog.outputs.prerelease != 'true' }}

      - name: Build and push
        id: build
        uses: docker/build-push-action@c3c9e263c25d99ce0380d002d59b67737d91b0dc # v7.4.0
        with:
          context: .
          file: ${{ matrix.dockerfile }}
          platforms: linux/amd64,linux/arm64
          push: true
          tags: ${{ steps.meta.outputs.tags }}
          labels: ${{ steps.meta.outputs.labels }}
          cache-from: type=gha,scope=${{ matrix.package }}
          cache-to: type=gha,mode=max,scope=${{ matrix.package }}

      - name: Summary
        env:
          IMAGE: ${{ steps.name.outputs.image }}
          TAGS: ${{ steps.meta.outputs.tags }}
          DIGEST: ${{ steps.build.outputs.digest }}
        run: |
          {
            echo "### $IMAGE"
            echo
            echo "Digest: \`$DIGEST\`"
            echo
            echo "Tags:"
            echo
            while read -r tag; do echo "- \`$tag\`"; done <<< "$TAGS"
          } >> "$GITHUB_STEP_SUMMARY"

  # The GitHub release: the changelog section as its notes, plus GitHub's list of commits. No assets:
  # the images are the artifact. A re-run edits the notes of a release that exists instead of failing.
  release:
    needs: [image, changelog]
    runs-on: ubuntu-latest
    permissions:
      contents: write # create the release, push the changelog to main
    env:
      GH_TOKEN: ${{ github.token }}
      VERSION: ${{ needs.changelog.outputs.version }}
      TAG: ${{ needs.changelog.outputs.tag }}
      PRERELEASE: ${{ needs.changelog.outputs.prerelease }}
    steps:
      - uses: actions/checkout@v4
        with:
          ref: ${{ needs.changelog.outputs.tag }}
          fetch-depth: 0

      - uses: actions/download-artifact@9000827ccba6bdab643e8b6fd33ac0654aef8333 # v8.0.2
        with:
          name: release-notes
          path: out

      - name: Publish the release
        run: |
          args=()
          if [ "$PRERELEASE" = "true" ]; then args+=(--prerelease); fi
          if gh release view "$TAG" >/dev/null 2>&1; then
            gh release edit "$TAG" --notes-file out/notes.md "${args[@]}"
          else
            gh release create "$TAG" --notes-file out/notes.md --generate-notes --verify-tag "${args[@]}"
          fi

      # A pushed tag whose changelog was prepared above: main gets the rename, so the next release starts
      # from an empty "Unreleased". Only when main is still the tagged commit; otherwise its "Unreleased"
      # may hold newer entries, which a rename would wrongly claim. The release is out either way, so
      # this step warns rather than fails. The tag never moves. A Run workflow skips this: it committed
      # the rename to main before tagging.
      - name: Record the changelog on main
        if: ${{ github.event_name == 'push' }}
        run: |
          if [ "$PRERELEASE" = "true" ]; then
            exit 0 # a prerelease leaves the changelog alone
          fi
          cp out/CHANGELOG.md CHANGELOG.md
          if git diff --quiet -- CHANGELOG.md; then
            exit 0 # the tagged commit had its section already
          fi
          git fetch -q origin main
          if [ "$(git rev-parse origin/main)" != "$(git rev-parse HEAD)" ]; then
            echo "::warning::main has moved past $TAG, so its CHANGELOG.md still lists $VERSION's entries under \"## Unreleased\". On main, run .github/scripts/changelog.sh prepare $VERSION and keep any newer entries under Unreleased."
            exit 0
          fi
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git commit -m "docs(changelog): release $VERSION" -- CHANGELOG.md
          if ! git push origin HEAD:main; then
            echo "::warning::Couldn't push the changelog to main. On main, run .github/scripts/changelog.sh prepare $VERSION and commit it."
          fi

  # Keep the last 10 versions of each image. A multi-arch index keeps its per-architecture children
  # (scripts/prune-images.sh explains why), so a pinned digest never breaks.
  prune:
    needs: [image, changelog]
    runs-on: ubuntu-latest
    permissions:
      contents: read
      packages: write
    strategy:
      matrix:
        package: [megafono, megafono-gateway]
    steps:
      - uses: actions/checkout@v4
        with:
          ref: ${{ needs.changelog.outputs.tag }}
      # The script reads manifests from the registry, which needs a login while a package is still private
      - uses: docker/login-action@dbcb813823bdd20940b903addbd779551569679f # v4.6.0
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}
      - name: Delete old image versions
        env:
          GH_TOKEN: ${{ github.token }}
          PACKAGE: ${{ matrix.package }}
          KEEP: "10"
        run: .github/scripts/prune-images.sh
