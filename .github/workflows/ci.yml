name: CI

on:
  # Branches only: a release tag runs these tests through release.yml instead
  push:
    branches: ['**']
  pull_request:
  # The release workflow runs these same tests before it builds the images
  workflow_call:

permissions:
  contents: read

# A newer push to a branch cancels its older run; never on main, where the release workflow runs these
# tests too (as a called workflow) and must not lose them to a push that lands meanwhile
concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: ${{ github.ref != 'refs/heads/main' }}

jobs:
  build-and-test:
    runs-on: ubuntu-latest
    timeout-minutes: 45
    steps:
      - uses: actions/checkout@v4

      # A merge must not move entries into a released CHANGELOG section (a branch made before a release
      # does, and then the next release finds Unreleased empty). Compare with the commit before this
      # push, or with a PR's base. The release workflow calls this file too; there the step is skipped.
      - name: Released changelog sections are unchanged
        if: github.event_name == 'push' || github.event_name == 'pull_request'
        env:
          BASE: ${{ github.event_name == 'pull_request' && github.event.pull_request.base.sha || github.event.before }}
          MESSAGE: ${{ github.event.head_commit.message || github.event.pull_request.title }}
        run: |
          if [ -z "$BASE" ] || [ "$BASE" = "0000000000000000000000000000000000000000" ]; then
            echo "No earlier commit to compare with."; exit 0
          fi
          case "$MESSAGE" in
            *"[edit released changelog]"*) echo "A released section may change: the commit or PR says so."; exit 0 ;;
          esac
          git fetch -q --depth=1 origin "$BASE"
          if ! git show "$BASE:CHANGELOG.md" > "$RUNNER_TEMP/base-CHANGELOG.md" 2>/dev/null; then
            echo "The earlier commit had no CHANGELOG.md."; exit 0
          fi
          .github/scripts/changelog.sh released "$RUNNER_TEMP/base-CHANGELOG.md"

      - uses: actions/setup-dotnet@v4
        with:
          global-json-file: global.json

      # Warnings are errors (Directory.Build.props), so both configurations must be clean
      - name: Build (Debug)
        run: dotnet build

      - name: Build (Release)
        run: dotnet build -c Release

      - name: Unit and integration tests
        run: |
          mkdir -p test-output
          dotnet test --project tests/Megafono.Tests --no-build -- --filter-not-trait "Suite=load" 2>&1 | tee test-output/megafono-tests.txt

      # Starts GoToSocial in Testcontainers; the Mastodon suite runs nightly instead
      - name: Interop tests
        run: |
          mkdir -p test-output
          dotnet test --project tests/Megafono.Interop.Tests --no-build -- --filter-not-trait "Suite=mastodon" 2>&1 | tee test-output/interop-tests.txt

      - name: Integration code stays under 100 lines
        run: scripts/count-integration-lines.sh

      - name: Build the images
        run: |
          docker build -f deploy/Dockerfile.megafono -t ghcr.io/cosmic-chimps/megafono:ci .
          docker build -f deploy/Dockerfile.gateway -t ghcr.io/cosmic-chimps/megafono-gateway:ci .
          docker build -f deploy/Dockerfile.sample -t ghcr.io/cosmic-chimps/megafono-sample:ci .

      - name: Upload test output
        if: failure()
        uses: actions/upload-artifact@v4
        with:
          name: test-output
          path: |
            test-output/
            **/TestResults/
          if-no-files-found: ignore
