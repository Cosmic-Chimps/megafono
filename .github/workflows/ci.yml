name: CI

on:
  # Branches only: a release tag runs these tests through release.yml instead
  push:
    branches: ['**']
  pull_request:
  # The release workflow runs these same tests before it builds the images
  workflow_call:

permissions:
  contents: read

# A newer push to a branch cancels its older run; never on main, where the release workflow runs these
# tests too (as a called workflow) and must not lose them to a push that lands meanwhile
concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: ${{ github.ref != 'refs/heads/main' }}

jobs:
  build-and-test:
    runs-on: ubuntu-latest
    timeout-minutes: 45
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0 # the release tags, for the changelog check

      # Released notes are never edited (a stale merge could still put text inside a released section); this
      # fails the push instead of the next release (.github/scripts/changelog.sh, "released")
      - name: Released changelog sections are unchanged
        run: .github/scripts/changelog.sh released

      # Notes live one file per change in changelog.d/, so a merge never touches a shared section. This fails a
      # push with a bad fragment or a "## Unreleased" section (a branch started before that rule), and the next
      # step tests the script itself
      - name: Release notes in changelog.d are well formed
        run: .github/scripts/changelog.sh check

      - name: Changelog script tests
        run: bash .github/scripts/changelog-test.sh

      - uses: actions/setup-dotnet@v4
        with:
          global-json-file: global.json

      # Warnings are errors (Directory.Build.props), so both configurations must be clean
      - name: Build (Debug)
        run: dotnet build

      - name: Build (Release)
        run: dotnet build -c Release

      - name: Unit and integration tests
        run: |
          mkdir -p test-output
          dotnet test --project tests/Megafono.Tests --no-build -- --filter-not-trait "Suite=load" 2>&1 | tee test-output/megafono-tests.txt

      # Starts GoToSocial in Testcontainers; the Mastodon suite runs nightly instead
      - name: Interop tests
        run: |
          mkdir -p test-output
          dotnet test --project tests/Megafono.Interop.Tests --no-build -- --filter-not-trait "Suite=mastodon" 2>&1 | tee test-output/interop-tests.txt

      - name: Integration code stays under 100 lines
        run: scripts/count-integration-lines.sh

      - name: Build the images
        run: |
          docker build -f deploy/Dockerfile.megafono -t ghcr.io/cosmic-chimps/megafono:ci .
          docker build -f deploy/Dockerfile.gateway -t ghcr.io/cosmic-chimps/megafono-gateway:ci .
          docker build -f deploy/Dockerfile.sample -t ghcr.io/cosmic-chimps/megafono-sample:ci .

      - name: Upload test output
        if: failure()
        uses: actions/upload-artifact@v4
        with:
          name: test-output
          path: |
            test-output/
            **/TestResults/
          if-no-files-found: ignore
